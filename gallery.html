	  <div id="imageModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <button class="zoom-btn" id="zoomToggle">🔍 Zoom</button>
    <img id="modalImage" src="" alt="Enlarged view">
  </div>
</div>
	  <script>
	  const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImage');
const closeBtn = document.querySelector('.close-btn');
const zoomBtn = document.getElementById('zoomToggle');
const images = document.querySelectorAll('.image');

let isZoomed = false;

// Open modal when an image is clicked
images.forEach(img => {
  img.addEventListener('click', () => {
    modal.style.display = 'flex';
    modalImg.src = img.src;
    resetZoom();
  });
});

// Close modal on 'X' click
closeBtn.addEventListener('click', closeModal);

// Close modal when clicking outside the content container
modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    closeModal();
  }
});

// Zoom toggle functionality
zoomBtn.addEventListener('click', () => {
  isZoomed = !isZoomed;
  if (isZoomed) {
    modalImg.classList.add('zoomed');
    zoomBtn.textContent = '🔍 Zoom Out';
  } else {
    resetZoom();
  }
});

function closeModal() {
  modal.style.display = 'none';
  resetZoom();
}

function resetZoom() {
  isZoomed = false;
  modalImg.classList.remove('zoomed');
  zoomBtn.textContent = '🔍 Zoom';
}
	  
	  </script>
